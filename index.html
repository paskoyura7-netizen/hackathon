<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Помічник — ІФНТУНГ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="link_in_tg">
      <a href="https://t.me/ifntungschedulebot" target="_blank">Відкрити Telegram-бот</a>
    </div>

    <div id="intro">
      <div class="intro-badge">ІФНТУНГ · AI</div>
      <h1 id="line1"></h1>
      <h1 id="line2"></h1>
      <h1 id="line3"></h1>
      <div class="intro-cursor" id="introCursor">|</div>
    </div>

    <div id="chatArea"></div>

    <div class="input-box" id="inputBox">
      <div class="input-status" id="statusBar">Готовий до розмови ✦</div>
      <div class="input-wrapper">
        <input class="input" id="messageInput" type="text" placeholder="Постав запитання..." autocomplete="off">
        <button class="send-btn mic-btn" id="micBtn" title="Голосове введення">🎤</button>
        <button class="send-btn" id="sendBtn" title="Надіслати">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
